<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BRAIN AI Widget</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background: transparent;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            align-items: stretch;
            justify-content: stretch;
        }

        #roa-chat-window {
            position: relative;
            bottom: 0;
            right: 0;
            width: 100% !important;
            height: 100% !important;
            border-radius: 0;
            box-shadow: none;
            border: none;
            transform: none !important;
            opacity: 1 !important;
            pointer-events: auto !important;
        }

        #roa-chat-trigger {
            display: none !important;
        }
    </style>
</head>

<body>
    <div id="roa-chat-window" role="dialog" aria-label="Chat ROA">
        <div id="roa-resize-handle" style="display:none;"></div>
        <div class="chat-header">
            <div class="header-info">
                <div class="bot-avatar" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" width="32" height="32">
                        <circle cx="12" cy="12" r="10" fill="url(#grad1)" />
                        <path d="M12 7v10M7 12h10" stroke="white" stroke-width="2" stroke-linecap="round" />
                        <defs>
                            <linearGradient id="grad1" x1="2" y1="2" x2="22" y2="22" gradientUnits="userSpaceOnUse">
                                <stop stop-color="#7C3AED" />
                                <stop offset="1" stop-color="#4F46E5" />
                            </linearGradient>
                        </defs>
                    </svg>
                </div>
                <span>BRAIN AI</span>
            </div>
            <button id="roa-close-chat" aria-label="Fechar chat" style="display: none;">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>

        <div id="roa-chat-messages" style="padding: 16px; overflow:auto;"></div>

        <div class="chat-input-area">
            <input type="file" id="roa-file-input" style="display:none;" />
            <button id="roa-upload-btn" title="Enviar arquivo" aria-label="Enviar arquivo">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path
                        d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48" />
                </svg>
            </button>
            <textarea id="roa-user-input" placeholder="Digite sua dúvida..." rows="1"></textarea>
            <button id="roa-send-btn" title="Enviar" aria-label="Enviar mensagem">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
            </button>
        </div>
    </div>

    <!-- Login Overlay -->
    <div id="roa-login-overlay" class="hidden">
        <h2>Acesse o BRAIN AI</h2>
        <div class="login-form">
            <input type="email" id="roa-email" placeholder="Seu e-mail">
            <input type="password" id="roa-password" placeholder="Sua senha">
            <button id="roa-login-btn">Acessar</button>
            <div id="roa-login-error"></div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/11.1.1/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="chat.js"></script>
</body>

</html>
