<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROA - Iniciar Teste</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #7C3AED 0%, #4F46E5 100%);
            --bg-gradient: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
            --glass: rgba(255, 255, 255, 0.85);
            --glass-border: rgba(255, 255, 255, 0.5);
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-gradient);
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            background: var(--glass);
            backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 28px;
            box-shadow: 0 24px 48px -12px rgba(0, 0, 0, 0.12);
            width: 100%;
            max-width: 420px;
            padding: 48px 40px;
            text-align: center;
        }

        .logo {
            font-size: 26px;
            font-weight: 700;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #64748b;
            font-size: 15px;
            margin-bottom: 36px;
        }

        label {
            display: block;
            text-align: left;
            font-size: 14px;
            font-weight: 500;
            color: #334155;
            margin-bottom: 8px;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px 16px;
            border: 1.5px solid #e2e8f0;
            border-radius: 12px;
            font-family: inherit;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            background: white;
        }

        input[type="text"]:focus {
            border-color: #7C3AED;
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.12);
        }

        button[type="submit"] {
            width: 100%;
            margin-top: 20px;
            padding: 15px;
            background: var(--primary-gradient);
            color: white;
            border: none;
            border-radius: 12px;
            font-family: inherit;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(79, 70, 229, 0.28);
            transition: transform 0.12s ease, box-shadow 0.12s ease;
        }

        button[type="submit"]:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(79, 70, 229, 0.24);
        }

        button[type="submit"]:disabled {
            opacity: 0.65;
            cursor: not-allowed;
            transform: none;
        }

        .error-msg {
            color: #ef4444;
            font-size: 13px;
            margin-top: 12px;
            min-height: 20px;
        }

        .hint {
            margin-top: 24px;
            font-size: 12px;
            color: #94a3b8;
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="logo">ROA Platform</div>
        <p class="subtitle">Assistente de Orientação Acadêmica</p>

        <form id="start-form">
            <label for="user-name">Informe seu nome para começar</label>
            <input type="text" id="user-name" placeholder="Ex: João Silva" autocomplete="off" required autofocus>
            <button type="submit" id="start-btn">Começar o teste →</button>
            <div id="error-msg" class="error-msg"></div>
        </form>

        <p class="hint">Nenhuma senha necessária. Apenas seu nome para registrar quem testou.</p>
    </div>

    <script>
        const BASE_URL = 'http://localhost:8000/ROA';

        // Already logged in? Go to dashboard.
        const existingToken = localStorage.getItem('roa_token');
        if (existingToken) {
            window.location.replace('index.html');
        }

        document.getElementById('start-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const name = document.getElementById('user-name').value.trim();
            const errorEl = document.getElementById('error-msg');
            const btn = document.getElementById('start-btn');

            if (!name) {
                errorEl.textContent = 'Por favor, insira seu nome.';
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Aguarde...';
            errorEl.textContent = '';

            try {
                const res = await fetch(`${BASE_URL}/register_student`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name })
                });

                const data = await res.json();

                if (res.ok && data.access_token) {
                    localStorage.setItem('roa_token', data.access_token);
                    localStorage.setItem('roa_user_name', name);
                    window.location.replace('index.html');
                } else {
                    errorEl.textContent = data.detail || 'Erro ao iniciar sessão.';
                    btn.disabled = false;
                    btn.textContent = 'Começar o teste →';
                }
            } catch (err) {
                errorEl.textContent = 'Erro ao conectar com o servidor.';
                btn.disabled = false;
                btn.textContent = 'Começar o teste →';
            }
        });
    </script>
</body>

</html>
