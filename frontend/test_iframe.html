<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Embed Test - ROA Chat</title>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #f4f7f9;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        .site-container {
            width: 80%;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #1e293b;
        }

        .chat-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 400px;
            height: 600px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: white;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-origin: bottom right;
            z-index: 1000;
        }

        .chat-container.hidden {
            transform: scale(0) translateY(100px);
            opacity: 0;
            pointer-events: none;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        #chat-toggle-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #7C3AED 0%, #4F46E5 100%);
            color: white;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(124, 58, 237, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1001;
            transition: transform 0.3s;
        }

        #chat-toggle-btn:hover {
            transform: scale(1.1);
        }

        #chat-toggle-btn svg {
            width: 28px;
            height: 28px;
        }
    </style>
</head>

<body>
    <div class="site-container">
        <h1>Meu Site Externo</h1>
        <p>Este é um exemplo de como o chat da ROA ficaria embutido em um site de terceiro usando <b>Iframe</b>.</p>
        <p>O robô ao lado está carregando diretamente do servidor da API.</p>
    </div>

    <button id="chat-toggle-btn">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="m3 21 1.9-5.7a8.5 8.5 0 1 1 3.8 3.8z" />
        </svg>
    </button>

    <div class="chat-container hidden" id="chat-popup">
        <iframe src="http://localhost:8000/static/widget.html"></iframe>
    </div>

    <script>
        const btn = document.getElementById('chat-toggle-btn');
        const popup = document.getElementById('chat-popup');

        btn.addEventListener('click', () => {
            popup.classList.toggle('hidden');
            if (popup.classList.contains('hidden')) {
                btn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 21 1.9-5.7a8.5 8.5 0 1 1 3.8 3.8z"/></svg>';
            } else {
                btn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>';
            }
        });
    </script>
</body>

</html>
